[project]
name = "ddwb"
version = "0.1.0"
description = "Deep Document Web Benchmark: public bodies, where they publish, and what their documents say"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5,<1.6",
    "httpx>=0.28.1",
    "mcp>=1.2,<2",
    "numpy>=2.5.4",
    "pdf-inspector>=1.25.2",
    "pypdf>=5",
    "requests>=2.32",
]

[project.optional-dependencies]
browser = ["playwright>=1.57"]  # the browser tier of the portal adapters (BoardDocs, Simbli behind bot protection)

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
public-records-mcp = "ddwb.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddwb"]
